name: Sync upstream skills

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/checkout@v4
        with:
          repository: wgtechlabs/clean-coding
          ref: main
          path: .upstream/clean-coding
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wgtechlabs/clean-code-review
          ref: main
          path: .upstream/clean-code-review
          persist-credentials: false
      - name: Sync bundled skills
        run: |
          python3 scripts/test-sync-skills.py
          bash scripts/sync-skills.sh .upstream
          git diff --check
      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: chore/sync-upstream-skills
          commit-message: '🔧 update: sync canonical skills'
          title: '🔧 update: sync canonical skills'
          body: |
            Import the canonical skills from the standalone repositories' main branches.
            Source commits are recorded in skills/UPSTREAM.md. Review the skill changes before merging.
          add-paths: |
            skills/clean-development/
            skills/clean-code-review/
            skills/UPSTREAM.md
